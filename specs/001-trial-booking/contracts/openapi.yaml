openapi: 3.1.0
info:
  title: Trial Booking API
  version: 1.0.0
servers:
  - url: /api
paths:
  /students:
    get:
      summary: List children for the seeded parent
      responses:
        "200":
          description: Student collection
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Student" }
                  requestId: { type: string }
  /trial-classes:
    get:
      summary: List classes with advisory availability
      responses:
        "200":
          description: Trial class collection
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TrialClass" }
                  requestId: { type: string }
  /trial-classes/{classId}/roster:
    get:
      summary: Get confirmed-only roster
      parameters:
        - $ref: "#/components/parameters/ClassId"
      responses:
        "200":
          description: Confirmed roster
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RosterEntry" }
                  requestId: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /bookings:
    post:
      summary: Create a pending booking
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [studentId, trialClassId]
              properties:
                studentId: { type: string, format: uuid }
                trialClassId: { type: string, format: uuid }
      responses:
        "201": { $ref: "#/components/responses/BookingResult" }
        "200": { $ref: "#/components/responses/BookingResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bookings/{bookingId}:
    get:
      summary: Get booking status
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200": { $ref: "#/components/responses/BookingResult" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bookings/{bookingId}/payment-result:
    post:
      summary: Record a mock payment result and finalize the booking
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [result]
              properties:
                result: { type: string, enum: [succeeded, failed] }
      responses:
        "200": { $ref: "#/components/responses/BookingResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClassId:
      name: classId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  schemas:
    Booking:
      type: object
      required: [id, studentId, trialClassId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        trialClassId: { type: string, format: uuid }
        status:
          type: string
          enum: [pending_payment, confirmed, payment_failed, capacity_unavailable, cancelled]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
    Student:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    TrialClass:
      type: object
      required: [id, title, startsAt, capacity, confirmedCount, availableSeats]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1 }
        confirmedCount: { type: integer, minimum: 0 }
        availableSeats: { type: integer, minimum: 0 }
    RosterEntry:
      type: object
      required: [bookingId, studentId, studentName, confirmedAt]
      properties:
        bookingId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        studentName: { type: string }
        confirmedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        requestId: { type: string }
  responses:
    BookingResult:
      description: Current booking outcome
      content:
        application/json:
          schema:
            type: object
            required: [data, requestId]
            properties:
              data: { $ref: "#/components/schemas/Booking" }
              requestId: { type: string }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Duplicate, idempotency, capacity, or transition conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

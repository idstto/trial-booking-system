services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trial_booking
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trial_booking"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - trial_booking_data:/var/lib/postgresql/data

volumes:
  trial_booking_data:
